<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none">
  <defs>
    <linearGradient id="front" x1="300" y1="320" x2="300" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8194f"/><stop offset="1" stop-color="#7d0030"/>
    </linearGradient>
    <linearGradient id="wall" x1="220" y1="260" x2="220" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c0030"/><stop offset="1" stop-color="#48002a"/>
    </linearGradient>
  </defs>

  <!-- confetti -->
  <g>
    <rect x="120" y="120" width="22" height="9" rx="4" fill="#f99c00" transform="rotate(-25 131 124)"/>
    <rect x="455" y="150" width="22" height="9" rx="4" fill="#00bb7f" transform="rotate(35 466 154)"/>
    <rect x="446" y="300" width="20" height="9" rx="4" fill="#fcbb00" transform="rotate(-18 456 304)"/>
    <rect x="120" y="300" width="20" height="9" rx="4" fill="#8d54ff" transform="rotate(22 130 304)"/>
    <rect x="182" y="92" width="18" height="8" rx="4" fill="#ff2357" transform="rotate(15 191 96)"/>
    <rect x="406" y="98" width="18" height="8" rx="4" fill="#8d54ff" transform="rotate(-30 415 102)"/>
    <circle cx="104" cy="216" r="6" fill="#ff2357"/>
    <circle cx="496" cy="232" r="6" fill="#fcbb00"/>
    <circle cx="300" cy="64" r="5" fill="#f99c00"/>
    <path d="M91 150 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#fcbb00"/>
    <path d="M509 292 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#00bb7f"/>
    <path d="M250 54 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#ff2357"/>
  </g>

  <!-- envelope back / mouth interior -->
  <rect x="148" y="258" width="304" height="180" rx="16" fill="#660030"/>

  <!-- letter (wide), emerging from the envelope -->
  <g>
    <rect x="186" y="112" width="228" height="256" rx="12" fill="#ffffff" stroke="#efe1da" stroke-width="2"/>
    <text x="300" y="170" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1.5" fill="#910038">THANK YOU</text>
    <rect x="232" y="206" width="136" height="9" rx="4.5" fill="#e7d8d2"/>
    <rect x="252" y="232" width="96" height="9" rx="4.5" fill="#eee2dc"/>
  </g>

  <!-- envelope walls + front pocket -->
  <g>
    <path d="M148 262 L300 330 L148 438 Z" fill="url(#wall)"/>
    <path d="M452 262 L300 330 L452 438 Z" fill="url(#wall)"/>
    <path d="M148 438 L452 438 L300 330 Z" fill="url(#front)"/>
    <!-- check / postmark -->
    <circle cx="384" cy="408" r="13" fill="none" stroke="#fcbb00" stroke-width="2.4" opacity="0.9"/>
    <path d="M378 408 l4 4 8 -8" stroke="#fcbb00" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Template Samples</title>
  <style>
    :root{
      --bg:#0e1116; --panel:#161b22; --line:#262d36; --ink:#e6edf3;
      --muted:#9aa7b4; --accent:#6ea8fe; --accent2:#8b5cf6;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%,#1b2435 0,transparent 60%),var(--bg);
      color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh;
    }
    a{color:inherit;}
    .wrap{max-width:1120px;margin:0 auto;padding:56px 24px 80px;}
    header.hero{text-align:center;margin-bottom:48px;}
    .eyebrow{display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
      border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;margin-bottom:20px;}
    h1{font-size:44px;line-height:1.05;margin:0 0 14px;letter-spacing:-1px;
      background:linear-gradient(180deg,#fff,#aebfd4);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .sub{color:var(--muted);font-size:17px;max-width:560px;margin:0 auto;line-height:1.5;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
    @media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:560px){.grid{grid-template-columns:1fr;} h1{font-size:34px;}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
      cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;display:flex;flex-direction:column;}
    .card:hover{transform:translateY(-4px);border-color:#3a4a63;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);}
    .thumb{position:relative;height:300px;background:#fff;overflow:hidden;border-bottom:1px solid var(--line);}
    /* render the real email shrunk to a thumbnail */
    .thumb iframe{position:absolute;top:0;left:0;width:200%;height:200%;border:0;
      transform:scale(.5);transform-origin:top left;pointer-events:none;}
    .thumb .overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.04));}
    .card .meta{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .card .name{font-size:15px;font-weight:600;}
    .card .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:999px;white-space:nowrap;}
    .footnote{text-align:center;color:var(--muted);font-size:13px;margin-top:46px;}

    /* ---- Category tabs ---- */
    .tabs{display:flex;justify-content:center;gap:10px;margin:0 0 36px;flex-wrap:wrap;}
    .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);
      font-size:14px;font-weight:600;padding:10px 22px;border-radius:999px;cursor:pointer;transition:.16s;display:flex;align-items:center;gap:8px;}
    .tab:hover{border-color:#3a4a63;color:var(--ink);}
    .tab.active{background:linear-gradient(135deg,#910038,#60003c);border-color:#910038;color:#fff;}
    .tab .count{font-size:11px;opacity:.7;border:1px solid currentColor;border-radius:999px;padding:1px 7px;}
    .tab.soon{opacity:.6;}
    .empty{text-align:center;color:var(--muted);padding:70px 20px;border:1px dashed var(--line);border-radius:16px;background:var(--panel);}
    .empty .big{font-size:18px;color:var(--ink);font-weight:600;margin-bottom:8px;}

    /* ---- Slide deck overlay ---- */
    .viewer{position:fixed;inset:0;height:100vh;height:100dvh;background:rgba(7,9,12,.92);backdrop-filter:blur(8px);
      display:none;z-index:50;flex-direction:column;}
    .viewer.open{display:flex;}
    .vbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;}
    .vtitle{font-size:15px;font-weight:600;}
    .vcount{color:var(--muted);font-size:13px;margin-left:10px;font-weight:400;}
    .vctrls{display:flex;align-items:center;gap:10px;}
    .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);
      width:42px;height:42px;border-radius:11px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
    .btn:hover{background:#212a36;border-color:#3a4a63;}
    .btn.close{font-size:22px;}
    .vstage{flex:1;display:flex;align-items:stretch;justify-content:center;gap:0;padding:0 14px 14px;min-height:0;position:relative;}
    .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;background:rgba(20,24,30,.72);}
    .nav:hover{background:rgba(40,48,60,.92);}
    #prevBig{left:18px;} #nextBig{right:18px;}
    .phone{flex:0 1 1040px;width:100%;height:100%;max-height:100%;background:#fff;border-radius:14px;overflow:hidden;
      border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(0,0,0,.8);}
    .phone iframe{width:100%;height:100%;border:0;display:block;}
    .dots{display:flex;justify-content:center;gap:7px;padding:0 0 22px;flex-wrap:wrap;}
    .dot{width:8px;height:8px;border-radius:50%;background:#2c3744;cursor:pointer;transition:.15s;}
    .dot.active{background:var(--accent);width:22px;border-radius:5px;}
    /* ---- Editor toolbar ---- */
    .vleft{display:flex;align-items:center;min-width:0;}
    .btn.wide{width:auto;padding:0 14px;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;}
    .btn.on{background:linear-gradient(135deg,#910038,#60003c);border-color:#910038;color:#fff;}
    .sep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:0 0 auto;}
    .vhint{text-align:center;font-size:12px;color:var(--muted);padding:0 22px 8px;min-height:17px;line-height:17px;}
    .vhint b{color:#e6edf3;font-weight:600;}
    .vhint.warn{color:#ffce7a;}
    .vhint code{background:#1b2330;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:#cfe;font-size:11px;}
    @media(max-width:680px){ .btn.wide span{display:none;} .btn.wide{padding:0;width:42px;} }
    @media(max-width:560px){
      .vbar{padding:12px 14px;}
      .vtitle{font-size:14px;}
      .btn{width:38px;height:38px;font-size:17px;}
      .vstage{gap:0;padding:0;align-items:stretch;}   /* edge-to-edge */
      .vstage .nav{display:none;}            /* hide side arrows; use top bar + dots + swipe */
      .phone{flex:1 1 auto;width:100%;border-radius:0;border:0;box-shadow:none;}
      .dots{padding:10px 0 14px;}
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <div class="wrap">
    <header class="hero">
      <h1>HOFWAMS · Email Templates</h1>
      <p class="sub">14 concepts on one brand system, pulled live from hofwams.com. Pick a category.</p>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;"></div>
    <p class="footnote">Open any template, hit <b style="color:#e6edf3">✎ Edit copy</b>, click any text to rewrite it, then <b style="color:#e6edf3">⤓ Download</b> the finished HTML. Edits auto-save in your browser · ← → to switch · Esc to close.</p>
  </div>

  <!-- Slide deck viewer -->
  <div class="viewer" id="viewer">
    <div class="vbar">
      <div class="vleft"><span class="vtitle" id="vtitle"></span><span class="vcount" id="vcount"></span></div>
      <div class="vctrls">
        <button class="btn wide" id="editBtn" title="Edit copy & images">✎ <span>Edit</span></button>
        <button class="btn wide" id="dlHtml" title="Download as HTML">⤓ <span>HTML</span></button>
        <button class="btn wide" id="dlPng" title="Download as PNG image">⤓ <span>PNG</span></button>
        <button class="btn" id="resetBtn" title="Restore original">↺</button>
        <span class="sep"></span>
        <button class="btn" id="prevBtn" title="Previous (←)">‹</button>
        <button class="btn" id="nextBtn" title="Next (→)">›</button>
        <button class="btn close" id="closeBtn" title="Close (Esc)">×</button>
      </div>
    </div>
    <div class="vhint" id="vhint"></div>
    <div class="vstage">
      <button class="btn nav" id="prevBig" title="Previous">‹</button>
      <div class="phone"><iframe id="vframe" title="Email preview"></iframe></div>
      <button class="btn nav" id="nextBig" title="Next">›</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <script>
    const CATS = [
      {key:"ready",      label:"Ready for Use"},
      {key:"welcome",    label:"Welcome"},
      {key:"organizers", label:"Organizers"},
      {key:"contact",    label:"Contact / Thank You"},
      {key:"newsletter", label:"Newsletter"},
    ];

    const TEMPLATES = [
      // ---- Ready for Use (production builds, hosted assets) ----
      {cat:"ready", name:"Organizer Onboarding", tag:"Live / Hosted", file:"build/HOFWAMS-Organizer-Onboarding.html"},
      {cat:"ready", name:"Outreach / Demo",      tag:"Live / Hosted", file:"build/HOFWAMS-Organizer-Outreach.html"},
      {cat:"ready", name:"The Organizer Brief",  tag:"Live / Hosted", file:"build/HOFWAMS-Newsletter-Weekly.html"},
      {cat:"ready", name:"Registration Confirm", tag:"Live / Hosted", file:"build/HOFWAMS-Contact-Minimal.html"},
      // ---- Welcome ----
      {cat:"welcome", name:"A · The Drop",     tag:"Photo Hero", file:"emails/hofwams-welcome-concert.html"},
      {cat:"welcome", name:"B · Warm Welcome", tag:"Light / Benefits", file:"emails/hofwams-welcome-warm.html"},
      {cat:"welcome", name:"C · Editorial",    tag:"Minimal", file:"emails/hofwams-welcome-minimal.html"},
      {cat:"welcome", name:"D · The Poster",   tag:"Bold / Flyer", file:"emails/hofwams-welcome-poster.html"},
      {cat:"welcome", name:"E · Walkthrough",  tag:"Feature Tour", file:"emails/hofwams-welcome-walkthrough.html"},
      {cat:"welcome", name:"F · Explore",      tag:"Hero / Scenes", file:"emails/hofwams-welcome-explore.html"},
      // ---- Organizers ----
      {cat:"organizers", name:"A · Onboarding",      tag:"Walkthrough", file:"emails/hofwams-organizer-onboarding.html"},
      {cat:"organizers", name:"B · Outreach / Demo", tag:"Benefits + Demo", file:"emails/hofwams-organizer-outreach.html"},
      // ---- Contact / Thank You ----
      {cat:"contact", name:"A · The VIP Pass", tag:"Dark / Ticket", file:"emails/hofwams-contact-vip.html"},
      {cat:"contact", name:"B · Next Steps",   tag:"Light / Numbered", file:"emails/hofwams-contact-steps.html"},
      {cat:"contact", name:"C · Quick Confirm",tag:"Minimal / Summary", file:"emails/hofwams-contact-minimal.html"},
      // ---- Newsletter ----
      {cat:"newsletter", name:"A · What's On",  tag:"Event Grid", file:"emails/hofwams-newsletter-scenes.html"},
      {cat:"newsletter", name:"B · The Weekly", tag:"Editorial Digest", file:"emails/hofwams-newsletter-weekly.html"},
      {cat:"newsletter", name:"C · The Lineup", tag:"Dark / Visual", file:"emails/hofwams-newsletter-lineup.html"},
    ];

    const grid  = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const tabsEl= document.getElementById('tabs');
    let activeCat = CATS[0].key;
    let view = [];   // templates in the active category (what the viewer pages through)

    // ---- Tabs ----
    CATS.forEach(cat=>{
      const n = TEMPLATES.filter(t=>t.cat===cat.key).length;
      const b = document.createElement('button');
      b.className = 'tab' + (n===0?' soon':'') + (cat.key===activeCat?' active':'');
      b.innerHTML = `${cat.label} <span class="count">${n||'soon'}</span>`;
      b.addEventListener('click', ()=>selectCat(cat.key));
      b.dataset.key = cat.key;
      tabsEl.appendChild(b);
    });

    function selectCat(key){
      activeCat = key;
      [...tabsEl.children].forEach(b=>b.classList.toggle('active', b.dataset.key===key));
      renderGrid();
    }

    function renderGrid(){
      view = TEMPLATES.filter(t=>t.cat===activeCat);
      grid.innerHTML = '';
      dots.innerHTML = '';
      if(view.length===0){
        grid.style.display='none';
        empty.style.display='block';
        const label = CATS.find(c=>c.key===activeCat).label;
        empty.innerHTML = `<div class="big">${label} templates — coming soon</div>We'll design these next, on the same HOFWAMS brand system.`;
        return;
      }
      empty.style.display='none';
      grid.style.display='grid';
      view.forEach((t,i)=>{
        const c = document.createElement('div');
        c.className = 'card';
        c.innerHTML = `
          <div class="thumb"><iframe src="${t.file}" loading="lazy" scrolling="no" tabindex="-1"></iframe><div class="overlay"></div></div>
          <div class="meta"><span class="name">${t.name}</span><span class="tag">${t.tag}</span></div>`;
        c.addEventListener('click', ()=>open(i));
        grid.appendChild(c);
        const d = document.createElement('div');
        d.className='dot'; d.addEventListener('click',()=>go(i)); dots.appendChild(d);
      });
    }

    // ---- Viewer logic ----
    const viewer = document.getElementById('viewer');
    const vframe = document.getElementById('vframe');
    const vtitle = document.getElementById('vtitle');
    const vcount = document.getElementById('vcount');
    const dots = document.getElementById('dots');
    let cur = 0;

    // ---- Inline copy editor ----
    const vhint    = document.getElementById('vhint');
    const editBtn  = document.getElementById('editBtn');
    const dlHtml   = document.getElementById('dlHtml');
    const dlPng    = document.getElementById('dlPng');
    const resetBtn = document.getElementById('resetBtn');
    const TEXT_SEL = 'p,h1,h2,h3,h4,h5,h6,span,a,li,td,div,strong,em,b,small';
    let editMode = false;     // is edit mode toggled on
    let canEdit  = false;     // could we fetch the source (needs http/hosted)
    let curFile  = null;
    const origCache = {};     // file -> pristine html
    const sKey = f => 'hofedit:' + f;

    function setHint(html, warn){ vhint.innerHTML = html || ''; vhint.classList.toggle('warn', !!warn); }

    function injectBase(html, file){
      const base = new URL(file.substring(0, file.lastIndexOf('/') + 1), location.href).href;
      const tag = `<base id="hf-base" href="${base}">`;
      return /<head[^>]*>/i.test(html) ? html.replace(/<head([^>]*)>/i, `<head$1>${tag}`) : tag + html;
    }

    async function render(){
      const t = view[cur];
      vtitle.textContent = t.name;
      vcount.textContent = `${cur + 1} / ${view.length}`;
      [...dots.children].forEach((d, i) => d.classList.toggle('active', i === cur));
      await loadTemplate(t.file);
    }

    async function loadTemplate(file){
      curFile = file;
      let orig;
      try {
        orig = await (await fetch(file)).text();
        canEdit = true;
      } catch (e) {                       // file:// blocks fetch — preview only
        canEdit = false;
        vframe.removeAttribute('srcdoc');
        vframe.src = file;
        updateToolbar();
        setHint('Preview only — to edit copy, serve this folder: <code>python3 -m http.server</code> then open <code>http://localhost:8000</code>', true);
        return;
      }
      origCache[file] = orig;
      const saved = localStorage.getItem(sKey(file));
      vframe.srcdoc = injectBase(saved != null ? saved : orig, file);
      updateToolbar();
    }

    // re-apply editability whenever the frame (re)loads
    vframe.addEventListener('load', () => { if (editMode && canEdit) applyEditable(); });

    function hasDirectText(el){
      for (const n of el.childNodes) if (n.nodeType === 3 && n.nodeValue.trim()) return true;
      return false;
    }
    function applyEditable(){
      const doc = vframe.contentDocument; if (!doc || !doc.body) return;
      if (!doc.getElementById('hf-edit-style')){
        const st = doc.createElement('style'); st.id = 'hf-edit-style';
        st.textContent = '[data-hfedit]{outline:1px dashed rgba(145,0,56,.5);outline-offset:2px;cursor:text;border-radius:2px;}'
          + '[data-hfedit]:hover{outline:1.5px dashed #910038;background:rgba(145,0,56,.05);}'
          + '[data-hfedit]:focus{outline:2px solid #910038;background:rgba(145,0,56,.07);}'
          + '[data-hfimg]{cursor:pointer;transition:.12s;}'
          + '[data-hfimg]:hover{outline:3px solid #910038;outline-offset:-3px;filter:brightness(.9);}'
          + '[data-hfbg]{position:relative!important;}'
          + '.hf-photobtn{position:absolute;top:10px;left:10px;z-index:9;background:rgba(145,0,56,.94);color:#fff;font:600 12px/1 Arial,sans-serif;padding:8px 12px;border-radius:8px;cursor:pointer;letter-spacing:.3px;box-shadow:0 4px 14px rgba(0,0,0,.3);}'
          + '.hf-photobtn:hover{background:#910038;}';
        doc.head.appendChild(st);
      }
      doc.body.querySelectorAll(TEXT_SEL).forEach(el => {
        if (hasDirectText(el) && !el.closest('[data-hfedit]')){
          el.setAttribute('contenteditable', 'true');
          el.setAttribute('data-hfedit', '1');
        }
      });
      markImages(doc);
      doc.body.addEventListener('input', onEdit, true);
      doc.body.addEventListener('keydown', enterAsBreak, true);
      doc.body.addEventListener('click', onImgClick, true);
      setHint('<b>Edit mode on</b> — click any text to retype, or click a photo to swap it. Changes auto-save here; use <b>HTML</b> or <b>PNG</b> to export.');
    }
    function markImages(doc){
      // real <img> photos (skip tiny logos/social icons)
      doc.querySelectorAll('img').forEach(img => {
        const w = img.clientWidth || parseInt(img.getAttribute('width')) || 0;
        if (w >= 70){ img.setAttribute('data-hfimg', 'img'); img.setAttribute('title', 'Click to change this photo'); }
      });
      // background-image heroes — add a floating "change photo" button
      doc.querySelectorAll('[style*="background-image"]').forEach(el => {
        if (el.hasAttribute('data-hfbg')) return;
        el.setAttribute('data-hfbg', '1');
        const btn = doc.createElement('div');
        btn.className = 'hf-photobtn'; btn.setAttribute('data-hfctl', '1'); btn.textContent = '📷 Change photo';
        el.appendChild(btn);
      });
    }
    function disableEditable(){
      const doc = vframe.contentDocument; if (!doc || !doc.body) return;
      doc.body.querySelectorAll('[data-hfedit]').forEach(el => { el.removeAttribute('contenteditable'); el.removeAttribute('data-hfedit'); });
      doc.querySelectorAll('[data-hfimg]').forEach(el => { el.removeAttribute('data-hfimg'); el.removeAttribute('title'); });
      doc.querySelectorAll('.hf-photobtn').forEach(b => b.remove());
      doc.querySelectorAll('[data-hfbg]').forEach(el => el.removeAttribute('data-hfbg'));
      doc.body.removeEventListener('input', onEdit, true);
      doc.body.removeEventListener('keydown', enterAsBreak, true);
      doc.body.removeEventListener('click', onImgClick, true);
    }
    function enterAsBreak(e){ if (e.key === 'Enter'){ e.preventDefault(); vframe.contentDocument.execCommand('insertLineBreak'); } }

    // ---- image swapping ----
    function onImgClick(e){
      const ctl = e.target.closest && e.target.closest('[data-hfctl]');
      if (ctl){ e.preventDefault(); e.stopPropagation(); replaceImage(ctl.parentElement, 'bg'); return; }
      const img = e.target.closest && e.target.closest('[data-hfimg]');
      if (img){ e.preventDefault(); e.stopPropagation(); replaceImage(img, 'img'); }
    }
    function replaceImage(el, kind){
      let cur = '';
      if (kind === 'img') cur = el.getAttribute('src') || '';
      else { const m = /url\(["']?(.*?)["']?\)/.exec(el.style.backgroundImage || ''); cur = m ? m[1] : ''; }
      const url = prompt('Paste the image URL for this photo:', cur || 'https://');
      if (url !== null && url.trim()) setImage(el, kind, url.trim());
    }
    function setImage(el, kind, val){
      if (kind === 'img'){ el.setAttribute('src', val); el.removeAttribute('srcset'); }
      else { el.style.backgroundImage = 'url("' + val + '")'; el.removeAttribute('background'); }
      saveEdits();
      setHint('<b>Photo updated ✓</b>');
    }

    async function downloadPNG(){
      if (!canEdit){ setHint('PNG export needs a local server — see the note above.', true); return; }
      if (typeof html2canvas === 'undefined'){ setHint('PNG renderer still loading — try again in a moment.', true); return; }
      const doc = vframe.contentDocument; if (!doc || !doc.body) return;
      saveCurrent();
      const wasEditing = editMode; if (wasEditing) disableEditable();
      const prevW = vframe.style.width;
      vframe.style.setProperty('width', '620px', 'important');   // tight, desktop-layout capture
      setHint('Rendering PNG…');
      await new Promise(r => setTimeout(r, 220));
      try {
        const body = doc.body;
        const canvas = await html2canvas(body, { useCORS: true, allowTaint: false, scale: 2,
          backgroundColor: getComputedStyle(body).backgroundColor || '#ffffff',
          width: body.scrollWidth, height: body.scrollHeight, windowWidth: body.scrollWidth, windowHeight: body.scrollHeight });
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = curFile.split('/').pop().replace(/\.html?$/, '') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setHint('<b>PNG downloaded ✓</b>');
      } catch (err) {
        setHint('Couldn\'t render PNG — an external image may have blocked it. HTML export still works.', true);
      } finally {
        vframe.style.width = prevW;
        if (wasEditing) applyEditable();
      }
    }

    let saveTimer;
    function onEdit(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveEdits, 350); }
    function getCleanHTML(){
      const doc = vframe.contentDocument;
      const clone = doc.documentElement.cloneNode(true);
      clone.querySelectorAll('[data-hfedit]').forEach(el => { el.removeAttribute('contenteditable'); el.removeAttribute('data-hfedit'); });
      clone.querySelectorAll('[data-hfimg]').forEach(el => { el.removeAttribute('data-hfimg'); el.removeAttribute('title'); });
      clone.querySelectorAll('[data-hfbg]').forEach(el => el.removeAttribute('data-hfbg'));
      clone.querySelectorAll('[data-hfctl], .hf-photobtn').forEach(el => el.remove());
      const st = clone.querySelector('#hf-edit-style'); if (st) st.remove();
      const bs = clone.querySelector('#hf-base'); if (bs) bs.remove();
      return '<!DOCTYPE html>\n' + clone.outerHTML;
    }
    function saveEdits(){
      if (!canEdit || !curFile) return;
      localStorage.setItem(sKey(curFile), getCleanHTML());
      setHint('<b>Saved ✓</b> — your copy edits are stored in this browser.');
    }
    function updateToolbar(){
      const edited = canEdit && curFile && localStorage.getItem(sKey(curFile)) != null;
      editBtn.classList.toggle('on', editMode);
      resetBtn.style.display = edited ? '' : 'none';
      editBtn.style.opacity = canEdit ? '1' : '.5';
    }
    function toggleEdit(){
      if (!canEdit){ setHint('Editing needs a local server — see the note above.', true); return; }
      editMode = !editMode;
      if (editMode) applyEditable();
      else { saveEdits(); disableEditable(); }
      updateToolbar();
    }
    function downloadTemplate(){
      const html = canEdit ? getCleanHTML() : null;
      if (!html){ setHint('Download needs a local server — see the note above.', true); return; }
      const name = curFile.split('/').pop();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    function resetTemplate(){
      if (!canEdit) return;
      if (!confirm('Discard your edits to this template and restore the original copy?')) return;
      localStorage.removeItem(sKey(curFile));
      vframe.srcdoc = injectBase(origCache[curFile], curFile);   // load fires -> reapplies editable if on
      updateToolbar();
      setHint('Original copy restored.');
    }
    function saveCurrent(){ if (editMode && canEdit) saveEdits(); }

    function open(i){ cur = i; viewer.classList.add('open'); document.body.style.overflow = 'hidden'; render(); }
    function close(){ saveCurrent(); viewer.classList.remove('open'); document.body.style.overflow = ''; vframe.removeAttribute('srcdoc'); vframe.src = 'about:blank'; setHint(''); }
    function go(i){ saveCurrent(); cur = (i + view.length) % view.length; render(); }

    editBtn.onclick  = toggleEdit;
    dlHtml.onclick   = downloadTemplate;
    dlPng.onclick    = downloadPNG;
    resetBtn.onclick = resetTemplate;

    document.getElementById('closeBtn').onclick = close;
    document.getElementById('prevBtn').onclick = ()=>go(cur-1);
    document.getElementById('nextBtn').onclick = ()=>go(cur+1);
    document.getElementById('prevBig').onclick = ()=>go(cur-1);
    document.getElementById('nextBig').onclick = ()=>go(cur+1);
    viewer.addEventListener('click',e=>{ if(e.target===viewer) close(); });
    document.addEventListener('keydown',e=>{
      if(!viewer.classList.contains('open')) return;
      if(e.key==='Escape') close();
      if(e.key==='ArrowRight') go(cur+1);
      if(e.key==='ArrowLeft') go(cur-1);
    });

    // Swipe left/right to change template (mobile)
    let tx=0, ty=0;
    const stage = document.querySelector('.vstage');
    stage.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
    stage.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
      if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) go(dx<0 ? cur+1 : cur-1);
    }, {passive:true});

    // init
    renderGrid();
  </script>
</body>
</html>
